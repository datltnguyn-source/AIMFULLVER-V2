name: Build Aimbot APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. JDK 17 ─────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ── 3. Android SDK (API 34 + build-tools 34.0.0) ─────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools & platform
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
          --sdk_root=$ANDROID_SDK_ROOT

      # ── 4. Gradle wrapper (generate từ properties đã commit) ──────────────
      - name: Generate & permission gradlew
        run: |
          gradle wrapper \
            --gradle-version 8.2 \
            --distribution-type bin \
            --no-daemon
          chmod +x gradlew

      # ── 5. OpenCV 4.9.0 — cache để lần sau không tải lại ─────────────────
      - name: Cache OpenCV SDK
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: opencv-4.9.0-android-sdk.zip
          key: opencv-4.9.0-android-sdk

      - name: Download OpenCV 4.9.0
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          wget -q --show-progress \
            https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip

      - name: Unpack OpenCV into project
        run: |
          unzip -q opencv-4.9.0-android-sdk.zip
          SDK=OpenCV-android-sdk/sdk

          mkdir -p opencv/native/libs/arm64-v8a
          mkdir -p opencv/native/libs/armeabi-v7a
          mkdir -p opencv/java/src

          cp "$SDK/native/libs/arm64-v8a/libopencv_java4.so"   opencv/native/libs/arm64-v8a/
          cp "$SDK/native/libs/armeabi-v7a/libopencv_java4.so" opencv/native/libs/armeabi-v7a/
          cp -r "$SDK/java/src/." opencv/java/src/

          echo "OpenCV unpacked:"
          ls opencv/native/libs/arm64-v8a/
          ls opencv/java/src/ | head -5

      # ── 6. Cache Gradle dependencies ──────────────────────────────────────
      - name: Cache Gradle home
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 7. Build debug APK ────────────────────────────────────────────────
      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m"

      # ── 8. Verify APK exists ──────────────────────────────────────────────
      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "APK NOT FOUND"; exit 1; fi
          echo "APK: $APK  $(du -sh $APK | cut -f1)"

      # ── 9. Upload artifact ────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aimbot-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

